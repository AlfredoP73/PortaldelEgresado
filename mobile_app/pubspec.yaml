name: mobile_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_riverpod: ^2.4.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.5.5
  fl_chart: ^0.70.2
  image_picker: ^1.2.3
  file_picker: ^12.0.0
  provider: ^6.1.5+1
  jwt_decoder: ^2.0.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
