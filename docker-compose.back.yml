version: '3.8'

services:
  auth:
    build:
      context: ./backend
      dockerfile: ./app/auth/Dockerfile
    container_name: portaldel_egresado_auth
    restart: always
    command: uvicorn app.auth.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/auth_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FRONTEND_URL: ${FRONTEND_URL}
      GRADUATES_URL: http://graduates:8000
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-portal.egresados.upc@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-vmxlkvqzcpycsxlk}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-portal.egresados.upc@gmail.com}

  companies:
    build:
      context: ./backend
      dockerfile: ./app/companies/Dockerfile
    container_name: portaldel_egresado_companies
    restart: always
    command: uvicorn app.companies.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/companies_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL:-llama-3.1-8b-instant}
    depends_on:
      - auth

  graduates:
    build:
      context: ./backend
      dockerfile: ./app/graduates/Dockerfile
    container_name: portaldel_egresado_graduates
    restart: always
    command: uvicorn app.graduates.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/graduates_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-cvs}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS:-avatars}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL:-llama-3.1-8b-instant}
    depends_on:
      - auth

  dashboard:
    build:
      context: ./backend
      dockerfile: ./app/dashboard/Dockerfile
    container_name: portaldel_egresado_dashboard
    restart: always
    command: uvicorn app.dashboard.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/auth_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL:-llama-3.1-8b-instant}
    depends_on:
      - auth
      - companies
      - graduates

  matchmaking:
    build:
      context: ./backend
      dockerfile: ./app/matchmaking/Dockerfile
    container_name: portaldel_egresado_matchmaking
    restart: always
    command: uvicorn app.matchmaking.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/matchmaking_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL:-llama-3.1-8b-instant}
    depends_on:
      - auth
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: portaldel_egresado_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5


  nginx:
    image: nginx:alpine
    container_name: portaldel_egresado_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/loading.html:/usr/share/nginx/html/loading.html:ro
    depends_on:
      - auth
      - companies
      - graduates
      - dashboard
      - matchmaking
