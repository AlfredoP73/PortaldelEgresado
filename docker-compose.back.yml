version: '3.8'

services:
  auth:
    build:
      context: ./backend
      dockerfile: ./app/auth/Dockerfile
    container_name: portaldel_egresado_auth
    command: uvicorn app.auth.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/auth_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FRONTEND_URL: ${FRONTEND_URL}

  companies:
    build:
      context: ./backend
      dockerfile: ./app/companies/Dockerfile
    container_name: portaldel_egresado_companies
    command: uvicorn app.companies.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/companies_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN}
    depends_on:
      - auth

  graduates:
    build:
      context: ./backend
      dockerfile: ./app/graduates/Dockerfile
    container_name: portaldel_egresado_graduates
    command: uvicorn app.graduates.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/graduates_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN}
      MINIO_URL: http://${DATA_HOST}:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: cvs
    depends_on:
      - auth

  dashboard:
    build:
      context: ./backend
      dockerfile: ./app/dashboard/Dockerfile
    container_name: portaldel_egresado_dashboard
    command: uvicorn app.dashboard.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/auth_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      - auth
      - companies
      - graduates

  matchmaking:
    build:
      context: ./backend
      dockerfile: ./app/matchmaking/Dockerfile
    container_name: portaldel_egresado_matchmaking
    command: uvicorn app.matchmaking.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DATA_HOST}:5432/matchmaking_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN}
    depends_on:
      - auth

  nginx:
    image: nginx:alpine
    container_name: portaldel_egresado_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/loading.html:/usr/share/nginx/html/loading.html:ro
    depends_on:
      - auth
      - companies
      - graduates
      - dashboard
      - matchmaking
