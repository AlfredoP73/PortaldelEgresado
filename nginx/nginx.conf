worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    client_max_body_size 50M;
    sendfile        on;
    keepalive_timeout  65;

    # Capturar el error 502 y mostrar la página de carga
    error_page 502 /loading.html;

    server {
        listen 80;
        server_name localhost;

        # Docker DNS resolver
        resolver 127.0.0.11 valid=30s;

        # Servir la página de carga personalizada
        location = /loading.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Frontend
        location / {
            proxy_pass http://frontend:5176;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Microservicio de Autenticación
        location /api/auth {
            proxy_pass http://auth:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Microservicio de Egresados (Módulo 1)
        location /api/modulo1 {
            proxy_pass http://graduates:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Microservicio de Empresas (Módulo 2)
        location /api/modulo2 {
            proxy_pass http://companies:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Microservicio de Matchmaking
        location /matching {
            proxy_pass http://matchmaking:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Microservicio Dashboard Administrativo (catch-all /api)
        location /api {
            proxy_pass http://dashboard:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
