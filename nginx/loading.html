<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5">
    <title>Iniciando Portal del Egresado...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .loader-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-left-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 400px;
            line-height: 1.5;
        }
        .countdown {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #64748b;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
    </div>
    <h1>Preparando tu entorno</h1>
    <p>La máquina de AWS está encendida y está construyendo el Portal del Egresado. Este proceso suele tardar unos 3 minutos la primera vez.</p>
    <p class="countdown">Esta página se actualizará automáticamente cada 5 segundos...</p>
</body>
</html>
