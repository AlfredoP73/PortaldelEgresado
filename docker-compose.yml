version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: portaldel_egresado_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Microservicio 1: Autenticación (puerto 8002) ──────────────────────────
  auth:
    build:
      context: ./backend
      dockerfile: ./app/auth/Dockerfile
    container_name: portaldel_egresado_auth
    command: uvicorn app.auth.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/auth_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FRONTEND_URL: http://localhost:5176
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  # ── Microservicio 2: Empresas y Vacantes (puerto 8001) ───────────────────
  companies:
    build:
      context: ./backend
      dockerfile: ./app/companies/Dockerfile
    container_name: portaldel_egresado_companies
    command: uvicorn app.companies.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/companies_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN:-token_interno_servicios}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

  # ── Microservicio 3: Egresados (puerto 8003) ─────────────────────────────
  graduates:
    build:
      context: ./backend
      dockerfile: ./app/graduates/Dockerfile
    container_name: portaldel_egresado_graduates
    command: uvicorn app.graduates.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/graduates_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN:-token_interno_servicios}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: cvs
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
  
  # ── Microservicio 4: Dashboard Administrativo (puerto 8004) ─────────────
  dashboard:
    build:
      context: ./backend
      dockerfile: ./app/dashboard/Dockerfile
    container_name: portaldel_egresado_dashboard
    command: uvicorn app.dashboard.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/auth_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      companies:
        condition: service_started
      graduates:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

  # ── Microservicio 5: Matchmaking (puerto 8005) ───────────────────────────
  matchmaking:
    build:
      context: ./backend
      dockerfile: ./app/matchmaking/Dockerfile
    container_name: portaldel_egresado_matchmaking
    command: uvicorn app.matchmaking.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/matchmaking_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN:-token_interno_servicios}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

  # ── MinIO para Almacenamiento de Archivos (S3) ─────────────────────────
  minio:
    image: quay.io/minio/minio
    container_name: portaldel_egresado_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  # ── API Gateway (Nginx) ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: portaldel_egresado_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/loading.html:/usr/share/nginx/html/loading.html:ro
    depends_on:
      - auth
      - companies
      - graduates
      - dashboard
      - matchmaking

  # ── Message Broker (RabbitMQ) ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: portaldel_egresado_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Centralized Logging (Loki + Promtail + Grafana) ───────────────────────
  loki:
    image: grafana/loki:2.8.2
    container_name: portaldel_egresado_loki
    user: "0:0"
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.8.2
    container_name: portaldel_egresado_promtail
    volumes:
      - ./logging/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana-oss:latest
    container_name: portaldel_egresado_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./logging/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
    depends_on:
      - loki

  # ── Frontend React (puerto 5176) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: portaldel_egresado_frontend
    environment:
      VITE_AUTH_URL: ""
      VITE_COMPANIES_URL: ""
      VITE_GRADUATES_URL: ""
      VITE_DASHBOARD_URL: ""
      VITE_MATCHMAKING_URL: ""
    depends_on:
      - auth
      - companies
      - graduates
      - matchmaking
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  minio_data: